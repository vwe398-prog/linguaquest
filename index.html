<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14162e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinguaQuest">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LinguaQuest</title>
<style>
:root{--bg:#090b1f;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--bd:rgba(255,255,255,.1);--tx:#f5f6ff;--mut:#a9aedb;--acc:#8b7bff;--ok:#3ee08c;--ko:#ff5d7a;--ink:#0d0f26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100dvh}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(70% 45% at 12% -5%,color-mix(in srgb,var(--acc) 34%,transparent),transparent 70%),
 radial-gradient(55% 40% at 105% 28%,rgba(120,80,255,.28),transparent 70%),
 radial-gradient(60% 40% at 0% 100%,rgba(0,190,255,.14),transparent 70%),
 radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px) 0 0/26px 26px,var(--bg);transition:background .5s}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1{font-size:1.75rem;margin:.2em 0;font-weight:900;letter-spacing:-.02em}h2{font-size:1.45rem;margin:.3em 0 .7em;font-weight:900;letter-spacing:-.02em}
small{color:var(--mut);font-size:.82rem}p{margin:.5em 0}b{font-weight:800}
.center{text-align:center}.note{color:var(--mut);font-size:.85rem}
.main{padding:6px 16px calc(110px + env(safe-area-inset-bottom));animation:fade .3s}
/* barre du haut et navigation */
.hd{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(var(--bg) 55%,transparent)}
.hd .chip:first-child{margin-right:auto}
.chip{background:var(--card2);border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:7px 13px;font-weight:800;font-size:.9rem;white-space:nowrap}
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:480px;display:flex;background:rgba(22,25,58,.82);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;padding:6px;z-index:6;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.nav button{flex:1;padding:8px 0 7px;font-size:.7rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;border-radius:18px;transition:background .2s}
.nav button span{font-size:1.3rem;position:relative;filter:grayscale(.9);opacity:.6;transition:transform .2s}
.nav button.on{color:var(--tx);background:color-mix(in srgb,var(--acc) 24%,transparent)}
.nav button.on span{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
.dot{position:absolute;top:-5px;right:-17px;background:var(--ko);color:#fff;font-size:.62rem;border-radius:999px;padding:1px 5px;font-style:normal;box-shadow:0 0 10px var(--ko)}
/* briques */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:15px 17px;margin:12px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pbar{display:block;height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;flex:1}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#fff));border-radius:999px;transition:width .4s;box-shadow:0 0 12px color-mix(in srgb,var(--acc) 70%,transparent)}
.pbar.red i{background:linear-gradient(90deg,#ff3d6e,#ff8a5c);box-shadow:0 0 12px #ff3d6e}.pbar.s{max-width:90px;height:8px}
.btn{display:block;width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));color:var(--ink);font-weight:900;font-size:1.05rem;padding:15px;border-radius:18px;margin-top:14px;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 55%,#000),0 12px 26px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .08s,box-shadow .08s;letter-spacing:.01em}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 55%,#000)}.btn:disabled{opacity:.4;box-shadow:none}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;position:relative;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(255,255,255,.12) 0)}
.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#14173a}
.ring>*{position:relative}.ring b{font-size:1.15rem}.ring small{font-size:.62rem}
.ring.sm{width:58px;height:58px}.ring.sm:before{inset:6px}.ring.sm b{font-size:.85rem;color:var(--acc)}
/* accueil */
.home{padding-top:calc(34px + env(safe-area-inset-top));text-align:center}
.orb{width:108px;height:108px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:3.6rem;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.28),rgba(139,123,255,.25) 45%,transparent 72%);box-shadow:0 0 60px rgba(139,123,255,.55),inset 0 0 22px rgba(255,255,255,.18);animation:bob 3.4s ease-in-out infinite}
.orb span{animation:spin 26s linear infinite;display:block}
.title{font-size:2.5rem;margin:.1em 0 0;background:linear-gradient(90deg,#fff,#c9c2ff 45%,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title span{background:linear-gradient(90deg,#ffc93c,#ff7a59);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:2px 0 18px}
.hstats{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.hstats span{background:var(--card2);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:.84rem;color:var(--mut)}.hstats b{color:var(--tx)}
.course{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 22%,transparent),rgba(255,255,255,.05) 60%);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:24px;padding:15px;margin:13px 0;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 30%,#000),0 14px 30px rgba(0,0,0,.3);transition:transform .08s;animation:rise .45s backwards}
.course:nth-of-type(2){animation-delay:.07s}.course:nth-of-type(3){animation-delay:.14s}
.course:active{transform:translateY(4px)}
.flag{font-size:2.3rem;width:62px;height:62px;display:grid;place-items:center;border-radius:20px;background:rgba(255,255,255,.1);flex:none}
.ci{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.ci b{font-size:1.2rem}
.dots{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.dots i{font-style:normal;font-size:.62rem;font-weight:800;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--mut)}
.dots i.ok{background:var(--acc);color:var(--ink)}.dots i.cur{outline:1.5px solid var(--acc);color:var(--tx)}
.hint{color:var(--mut);font-size:.84rem;margin-top:24px}
/* carte */
.levels{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.lv{padding:6px 12px;border-radius:999px;font-weight:900;font-size:.82rem;background:var(--card2);border:1px solid var(--bd);color:var(--tx)}
.lv.off{opacity:.45}.lv.on{background:var(--acc);color:var(--ink);border-color:transparent;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 60%,transparent)}
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 30%,transparent),rgba(255,255,255,.05));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);margin-bottom:6px}
.hero-t{flex:1;display:flex;flex-direction:column;gap:6px}.hero-t b{font-size:1.3rem;letter-spacing:-.02em}.hero-t .pbar{flex:none;width:100%}
.path{position:relative;width:360px;max-width:100%;margin:14px auto 0}
.trail{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:visible}
.trail path{fill:none;stroke-linecap:round}
.trail .t0{stroke:rgba(255,255,255,.07);stroke-width:26}
.trail .t1{stroke:color-mix(in srgb,var(--acc) 55%,transparent);stroke-width:4;stroke-dasharray:2 14;animation:dash 1.6s linear infinite}
.nrow{position:absolute;left:50%;width:170px;transform:translateX(calc(-50% + var(--x)));text-align:center}
.node{width:86px;height:86px;border-radius:50%;margin-top:6px;position:relative;font-size:2.3rem;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 78%,#fff),var(--acc));box-shadow:0 8px 0 color-mix(in srgb,var(--acc) 50%,#000),0 16px 28px rgba(0,0,0,.4),inset 0 -6px 12px rgba(0,0,0,.15),inset 0 5px 8px rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--acc) 50%,#000)}
.node span{display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.node.lock{background:linear-gradient(180deg,#3a3f6e,#2a2e55);box-shadow:0 8px 0 #1a1d3c,0 16px 28px rgba(0,0,0,.35);font-size:1.7rem}.node.lock span{opacity:.6}
.node.pass{background:linear-gradient(180deg,#7df2b4,var(--ok));box-shadow:0 8px 0 #1c9a5c,0 16px 28px rgba(0,0,0,.4),inset 0 5px 8px rgba(255,255,255,.4)}
.node em{position:absolute;right:-4px;top:-4px;width:28px;height:28px;border-radius:50%;background:#fff;color:#1c9a5c;font-style:normal;font-weight:900;font-size:1rem;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.node.cur:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--acc);animation:pulse 1.6s ease-out infinite}
.go{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#fff;color:var(--ink);font-style:normal;font-weight:900;font-size:.74rem;padding:5px 11px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;z-index:2;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.go:after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.nlab{margin-top:16px;line-height:1.2;display:inline-block;position:relative;padding:5px 10px;border-radius:12px;background:color-mix(in srgb,var(--bg) 88%,transparent)}.nlab b{display:block;font-size:.9rem}.nlab small{font-size:.72rem}
.node.bossn{width:112px;height:112px;font-size:3.1rem;background:linear-gradient(180deg,#ff8aa0,#ff3d6e);box-shadow:0 9px 0 #a8183e,0 0 44px rgba(255,61,110,.6),inset 0 6px 10px rgba(255,255,255,.35);animation:bob 2.6s ease-in-out infinite}
.node.bossn.pass{background:linear-gradient(180deg,#ffe58a,#ffc93c);box-shadow:0 9px 0 #b78513,0 0 44px rgba(255,201,60,.6),inset 0 6px 10px rgba(255,255,255,.4)}
.back{position:fixed;inset:0;background:rgba(5,6,20,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;animation:fade .2s}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;z-index:21;background:#161a40;border:1px solid var(--bd);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1.1);max-height:88dvh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 10px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}.sh-h>span{font-size:2.2rem;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:color-mix(in srgb,var(--acc) 25%,transparent)}
.sh-h div{flex:1;display:flex;flex-direction:column}.sh-h b{font-size:1.2rem}
.les{display:flex;align-items:center;gap:12px;width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-top:8px;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s}
.les:active{transform:translateY(3px);box-shadow:none}.les span{font-size:1.35rem}.les b{flex:1}.les i{font-style:normal;color:var(--acc);font-weight:800;font-size:.85rem}
.les.test{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));color:var(--ink);border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 55%,#000)}.les.test i{color:var(--ink)}
/* divers */
.big{font-size:3.6rem;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--bd);margin-top:8px}
.row>span:first-child{flex:1}
.game{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 20%,transparent),rgba(255,255,255,.05) 65%);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:24px;padding:15px;margin:13px 0;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 28%,#000);transition:transform .08s}
.game:active{transform:translateY(4px)}
.game>span{font-size:2.1rem;width:60px;height:60px;display:grid;place-items:center;border-radius:20px;background:rgba(255,255,255,.1);flex:none}.game div{display:flex;flex-direction:column}.game b{font-size:1.12rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;text-align:center}.stat b{display:block;font-size:1.9rem;font-weight:900;background:linear-gradient(180deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.bd{text-align:center;opacity:.25;filter:grayscale(1)}.bd.ok{opacity:1;filter:none}.bd span{font-size:1.8rem;display:grid;place-items:center;width:52px;height:52px;margin:0 auto 3px;border-radius:50%;background:rgba(255,255,255,.08)}.bd.ok span{background:color-mix(in srgb,var(--acc) 28%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 45%,transparent)}.bd small{font-size:.66rem;line-height:1.15;display:block}
.tg{background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:7px 12px;font-weight:800;font-size:.86rem;display:inline-block;cursor:pointer}
.tg.red{color:var(--ko)}
select{background:#20244f;border:1px solid var(--bd);border-radius:11px;padding:7px 10px}
/* séance */
.sess{min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 18px 210px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px}.top .pbar{height:14px}
.x{font-size:1.2rem;color:var(--mut);width:36px;height:36px;border-radius:50%;background:var(--card2);flex:none}
.lives{font-weight:900;white-space:nowrap;background:var(--card2);border-radius:999px;padding:5px 11px;font-size:.9rem}
.bossbar{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:2rem;padding:8px 12px;border-radius:18px;background:rgba(255,61,110,.12);border:1px solid rgba(255,61,110,.35)}.bossbar span{animation:bob 1.6s ease-in-out infinite}
.exo{margin-top:24px;animation:slide .28s cubic-bezier(.2,.8,.3,1)}
.lab{color:var(--acc);font-weight:900;margin-bottom:10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.q{font-size:1.6rem;font-weight:900;margin:4px 0 24px;letter-spacing:-.02em;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:13px 14px;font-size:1.05rem;font-weight:700;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,border-color .15s}
.opt i{font-style:normal;flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.8rem;font-weight:900;background:rgba(255,255,255,.1);color:var(--mut)}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.good{background:rgba(62,224,140,.16);border-color:var(--ok);box-shadow:0 0 22px rgba(62,224,140,.35)}.opt.good i{background:var(--ok);color:var(--ink)}
.opt.bad{background:rgba(255,93,122,.16);border-color:var(--ko);animation:shake .3s}.opt.bad i{background:var(--ko);color:#fff}
.opt.sel{border-color:var(--acc);box-shadow:0 0 18px color-mix(in srgb,var(--acc) 45%,transparent)}.opt.m{justify-content:center;text-align:center;padding:14px 8px;width:100%;margin-bottom:10px;font-size:.96rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:16px;font-size:1.15rem;outline:0;font-weight:700}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.line{min-height:66px;border-bottom:2px dashed var(--bd);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 12px;margin-bottom:20px}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tile{background:#20244f;border:1.5px solid var(--bd);border-radius:14px;padding:9px 14px;font-size:1.05rem;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.4);animation:pop .15s}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile.used{opacity:.18;box-shadow:none}
.flash{border-radius:28px;padding:44px 20px;text-align:center;animation:pop .3s;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 30%,transparent),rgba(255,255,255,.05));border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);box-shadow:0 20px 50px color-mix(in srgb,var(--acc) 22%,transparent)}
.ft{font-size:2.1rem;font-weight:900;letter-spacing:-.02em;line-height:1.2}.ff{font-size:1.1rem;color:var(--mut);margin:10px 0 16px}
.spk{background:var(--card2);border:1px solid var(--bd);border-radius:50%;width:56px;height:56px;font-size:1.5rem}
.spk.xl{width:104px;height:104px;font-size:2.8rem;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));border:0;margin:10px 0 26px;box-shadow:0 7px 0 color-mix(in srgb,var(--acc) 55%,#000),0 0 40px color-mix(in srgb,var(--acc) 50%,transparent)}
.spk:active{transform:translateY(4px)}
.info{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px}
.info.txt{font-size:1.15rem;line-height:1.65}.info.small{font-size:.96rem;line-height:1.5;padding:14px;border-left:4px solid var(--acc)}
.info b{color:var(--acc)}
.bottom{margin-top:28px}
.fb{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;animation:up .22s cubic-bezier(.2,.9,.3,1.1);z-index:9;box-shadow:0 -16px 40px rgba(0,0,0,.45)}
.fb.ok{background:linear-gradient(180deg,#1b5a3d,#123a29);border-top:2px solid var(--ok)}.fb.ko{background:linear-gradient(180deg,#5e1f33,#3a1420);border-top:2px solid var(--ko)}
.fb>b{font-size:1.3rem;font-weight:900}.fb.ok>b{color:var(--ok)}.fb.ko>b{color:#ff9db0}
.fb.ok .btn{--acc:#3ee08c}.fb.ko .btn{--acc:#ff5d7a;color:#fff}
.res{align-items:center;justify-content:center;text-align:center;padding-bottom:40px}
.halo{position:relative;width:170px;height:170px;display:grid;place-items:center;margin-bottom:6px}
.halo.win:before{content:"";position:absolute;inset:-40px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--acc) 42%,transparent) 0 12deg,transparent 12deg 24deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 14s linear infinite}
.remo{font-size:4.4rem;animation:pop .5s cubic-bezier(.2,1.6,.4,1);position:relative;line-height:1.1}
.xp{font-size:2.2rem;font-weight:900;margin:14px 0 4px;background:linear-gradient(180deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .5s .2s backwards}
.res .btn{max-width:340px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-40px;font-style:normal;font-size:1.5rem;animation:fall linear forwards}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{aspect-ratio:1/1;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));color:var(--ink);border-radius:18px;font-weight:900;font-size:1.7rem;padding:6px;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 55%,#000);overflow:hidden}
.mc.up{background:#20244f;color:var(--tx);font-size:.88rem;border:1.5px solid var(--bd);box-shadow:none;animation:flip .25s}
.mc.good{border-color:var(--ok);background:rgba(62,224,140,.16)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes bob{50%{translate:0 -7px}}
@keyframes spin{to{rotate:360deg}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;translate:0 16px}}
@keyframes slide{from{opacity:0;translate:26px 0}}
@keyframes dash{to{stroke-dashoffset:-16}}
@keyframes pulse{from{transform:scale(.92);opacity:.9}to{transform:scale(1.28);opacity:0}}
@keyframes flip{from{transform:rotateY(90deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:359px){.path{zoom:.88}}

  p: ["Ils ont exigé qu'il démissionne.|They demanded that he resign.", "Il est essentiel qu'elle soit informée.|It is essential that she be informed.", "L'entreprise doit se conformer à la loi.|The company must comply with the law.", "Le contrat est contraignant.|The contract is binding.", "Le tribunal a statué en faveur du plaignant.|The court ruled in favour of the claimant.", "Ils ont préféré un règlement amiable.|They preferred a settlement."],

  g: ["Le passé irréel", "Certaines expressions sont suivies d'un <b>prétérit</b> qui ne parle pas du passé : il marque l'irréel ou le souhait.<br><br>• <b>It's (high) time</b> + sujet + prétérit : It's high time you <b>took</b> a break.<br>• <b>would rather</b> + sujet + prétérit : I'd rather you <b>didn't</b> smoke here.<br>• <b>as if / as though</b> : He talks as if he <b>knew</b> everything.<br>• <b>suppose / supposing</b> : Supposing you <b>lost</b> your job, what would you do?<br><br>Pour le passé : prétérit → past perfect. He looked as if he <b>had seen</b> a ghost."],

  p: ["Il est grand temps que tu prennes des vacances.|It's high time you took a holiday.", "Je préférerais que tu ne le dises à personne.|I'd rather you didn't tell anyone.", "Il parle comme s'il savait tout.|He talks as if he knew everything.", "Elle a du mal à faire face au stress.|She finds it hard to cope with stress.", "Ne rumine pas tes erreurs.|Don't dwell on your mistakes.", "Je me sens complètement accablé.|I feel completely overwhelmed."],

{ t: "Connecteurs avancés", c: "Singapour", e: "🚢",
  w: ["nonobstant|notwithstanding", "quoique|albeit", "dans la mesure où|insofar as", "par lequel|whereby", "de peur que|lest", "d'où|hence", "en outre|furthermore", "ainsi|thus", "à l'inverse|conversely", "pour autant que|as long as", "étant donné que|given that", "de même|likewise"],
  g: ["Les liens du texte soutenu", "• <b>albeit</b> + adjectif / adverbe : quoique. A useful, <b>albeit</b> costly, reform.<br>• <b>notwithstanding</b> + nom : malgré. <b>Notwithstanding</b> the risks…<br>• <b>insofar as</b> : dans la mesure où.<br>• <b>whereby</b> : par lequel. A system <b>whereby</b> workers share profits.<br>• <b>lest</b> + forme de base : de peur que. He left early <b>lest</b> he <b>miss</b> the train.<br>• <b>hence / thus</b> : d'où, ainsi. Costs rose; <b>hence</b> the delay.<br>• <b>given that</b> : étant donné que. <b>Conversely</b> : à l'inverse."],
  x: ["It was a successful, ___ expensive, project.|albeit|although it|despite", "___ the risks, the deal went ahead.|Notwithstanding|Albeit|Whereby", "They signed an agreement ___ both countries cut tariffs.|whereby|lest|hence", "She spoke quietly ___ she wake the baby.|lest|hence|albeit", "Demand fell; ___ the drop in prices.|hence|lest|whereby", "___ that costs are rising, we must act now.|Given|Albeit|Lest"],
  p: ["C'était un projet réussi, quoique coûteux.|It was a successful, albeit costly, project.", "Étant donné que les coûts augmentent, il faut agir.|Given that costs are rising, we must act.", "C'est un système par lequel les salariés partagent les bénéfices.|It is a system whereby workers share the profits.", "La demande a chuté, d'où la baisse des prix.|Demand fell, hence the drop in prices.", "À l'inverse, les importations ont augmenté.|Conversely, imports have risen.", "En outre, le commerce est en plein essor.|Furthermore, trade is booming."],
  r: "Singapore has built its wealth on trade, albeit with few natural resources. Given that it imports almost all its food, it depends heavily on stable supply chains. Hence its agreements whereby partner countries guarantee deliveries. Notwithstanding recent tensions, exports grew last year. Conversely, several larger economies saw theirs fall.",

{ t: "Expressions imagées", c: "Dublin", e: "🎭",
  w: ["facile comme tout|a piece of cake", "coûter les yeux de la tête|to cost an arm and a leg", "tourner autour du pot|to beat about the bush", "vendre la mèche|to let the cat out of the bag", "être mal en point (pas en forme)|to be under the weather", "mettre le doigt dessus|to hit the nail on the head", "une fois de temps en temps|once in a blue moon", "briser la glace|to break the ice", "remettre à plus tard|to take a rain check", "avoir le trac|to get cold feet", "faire d'une pierre deux coups|to kill two birds with one stone", "en un clin d'œil|in the blink of an eye"],
  g: ["Les idiomes", "Un idiome a un sens global qui ne se déduit pas des mots.<br><br>• <b>It's a piece of cake</b> : c'est très facile.<br>• <b>to let the cat out of the bag</b> : révéler un secret par mégarde.<br>• <b>to get cold feet</b> : avoir peur au dernier moment et renoncer.<br>• <b>once in a blue moon</b> : très rarement.<br><br>On ne change ni les mots ni le nombre : « to beat about <b>the bush</b> », jamais « the bushes ». Ils appartiennent à l'oral et à l'écrit informel."],
  x: ["The exam was a piece of ___.|cake|bread|pie crust", "Stop beating about the ___ and tell me!|bush|tree|garden", "That car cost an arm and a ___.|leg|hand|foot", "He got cold ___ and cancelled the wedding.|feet|hands|legs", "We only go out once in a blue ___.|moon|sun|sky", "You've hit the ___ on the head.|nail|hammer|point"],
  p: ["L'examen était très facile.|The exam was a piece of cake.", "Arrête de tourner autour du pot.|Stop beating about the bush.", "Cette voiture a coûté les yeux de la tête.|That car cost an arm and a leg.", "Qui a vendu la mèche ?|Who let the cat out of the bag?", "Je ne me sens pas très bien aujourd'hui.|I'm feeling a bit under the weather today.", "Une blague a brisé la glace.|A joke broke the ice."],
  r: "Liam wanted to surprise his wife with a trip that cost an arm and a leg. Planning it was a piece of cake, but keeping it secret was not: his sister let the cat out of the bag at dinner. Liam nearly got cold feet. His wife laughed, which broke the ice. They only travel once in a blue moon, so she was delighted.",

  g: ["Les propositions participiales", "À l'écrit, un participe remplace une subordonnée entière. Le sujet doit être <b>le même</b> que celui de la principale.<br><br>• <b>-ing</b> (sens actif, en même temps) : <b>Walking</b> home, I met Tom.<br>• <b>Having + participe</b> (action antérieure) : <b>Having finished</b> the report, she left.<br>• <b>Participe passé</b> (sens passif) : <b>Seen</b> from above, the city looks tiny.<br>• Avec négation : <b>Not knowing</b> what to do, he waited.<br><br>Expressions figées : <b>Generally speaking</b>, <b>Judging by</b>…, <b>All things considered</b>."],
  x: ["___ finished the report, she went home.|Having|Had|To have been", "___ from above, the city looks tiny.|Seen|Seeing|Having seeing", "Not ___ what to say, he remained silent.|knowing|known|to knowing", "___ by his tone, he was furious.|Judging|Judged|To judge it", "___ home, I ran into an old friend.|Walking|Walked|Having walk", "___ in 1900, the house needs repairs.|Built|Building|Having build"],
  p: ["Ayant terminé le rapport, elle est rentrée.|Having finished the report, she went home.", "Vue d'en haut, la ville paraît minuscule.|Seen from above, the city looks tiny.", "Ne sachant que dire, il s'est tu.|Not knowing what to say, he remained silent.", "À en juger par son ton, il était furieux.|Judging by his tone, he was furious.", "Tout bien considéré, c'était la bonne décision.|All things considered, it was the right decision.", "Nous devons peser le pour et le contre.|We must weigh up the pros and cons."],
  r: "Faced with a shortage of beds, the doctor had to decide which patient to treat first. Having weighed up both cases, she chose the younger man. Not knowing the families, she felt she could judge fairly. Strictly speaking, she had followed the rules. All things considered, though, the dilemma stayed on her conscience for years.",

  w: ["faire valoir|to put forward", "écarter (une idée)|to rule out", "s'en tenir à|to stick to", "faire marche arrière|to back down", "se résumer à|to boil down to", "tenir compte de|to take into account", "passer sous silence|to gloss over", "insister lourdement|to hammer home", "admettre (concéder)|to concede", "réfuter|to refute", "le contre-argument|the counterargument", "à juste titre|rightly"],
  g: ["Insister et concéder", "<b>Insister</b><br>• <b>do / does / did</b> + verbe : I <b>do</b> believe you. She <b>did</b> warn us.<br>• <b>indeed</b>, <b>by no means</b>, <b>whatsoever</b> : There is no doubt <b>whatsoever</b>.<br><br><b>Concéder puis opposer</b><br>• <b>Admittedly</b>, …, <b>but</b>… : <b>Admittedly</b>, it is expensive, but it works.<br>• <b>While it is true that</b>… ; <b>Granted</b>, … ; <b>That said</b>, …<br>• <b>Much as</b> I admire him, I disagree.<br>• <b>However</b> + adjectif : <b>However</b> hard we try…"],
  x: ["I ___ understand your point, but I disagree.|do|am|have do", "There is no evidence ___.|whatsoever|whatever it|however", "___, the plan is costly, but it will save lives.|Admittedly|Whereby|Lest", "Much ___ I respect her, I can't support the proposal.|as|that|though as", "___ hard they tried, they couldn't agree.|However|Whatever|Much", "She ___ warn us, but nobody listened.|did|was|had did"],
  p: ["Je comprends vraiment ton point de vue.|I do understand your point of view.", "Il n'y a absolument aucune preuve.|There is no evidence whatsoever.", "Certes, c'est cher, mais ça marche.|Admittedly, it is expensive, but it works.", "Tout se résume à l'argent.|It all boils down to money.", "Nous ne pouvons pas écarter cette possibilité.|We cannot rule out this possibility.", "Elle a refusé de faire marche arrière.|She refused to back down."],
  r: "In the debate on a four-day week, the first speaker put forward a simple argument: rested staff work better. Her opponent conceded that this was true, but said it all boiled down to cost. Admittedly, small firms would struggle. She did not back down, however. There was no evidence whatsoever, she said, that output would fall.",

  p: ["Le locataire devra payer le loyer chaque mois.|The Tenant shall pay the rent monthly.", "Je déclare par la présente que c'est exact.|I hereby declare that this is correct.", "Le contrat sera nul et non avenu.|The contract shall be null and void.", "Chaque partie peut résilier le contrat.|Either party may terminate the contract.", "Cette offre est soumise à approbation.|This offer is subject to approval.", "L'entreprise décline toute responsabilité.|The company accepts no liability."],
  r: "The Supplier shall deliver the goods within thirty days. In the event that delivery is delayed, the Supplier shall notify the Buyer forthwith. Either party may terminate this agreement pursuant to clause 9. Any amendment not made in writing shall be null and void. The Supplier shall indemnify the Buyer against any loss arising from a breach thereof.",

  g: ["Choisir le mot juste", "Là où le français précise par un adverbe, l'anglais change de verbe.<br><br><b>Regarder</b> : <b>glance</b> (un coup d'œil rapide), <b>stare</b> (fixement), <b>gaze</b> (longuement, avec admiration), <b>glimpse</b> (entrevoir), <b>peer</b> (en plissant les yeux), <b>glare</b> (avec colère).<br><br><b>Marcher</b> : <b>stroll</b> (tranquillement), <b>stride</b> (à grands pas), <b>trudge</b> (péniblement), <b>tiptoe</b> (sur la pointe des pieds), <b>stagger</b> (en titubant).<br><br><b>Parler / rire</b> : <b>mutter</b>, <b>whisper</b>, <b>yell</b> ; <b>giggle</b> (nerveusement), <b>snigger</b> (méchamment), <b>chuckle</b> (doucement)."],
  x: ["She ___ at her watch and kept talking. (rapidement)|glanced|stared|gazed", "He ___ angrily at the driver who had cut in.|glared|glimpsed|glanced", "Exhausted, they ___ through the deep snow.|trudged|strolled|tiptoed", "She ___ into the room so as not to wake him.|tiptoed|strode|staggered", "He ___ something under his breath.|muttered|yelled|giggled", "We ___ along the river in the evening sun.|strolled|trudged|staggered"],
  p: ["Elle a jeté un coup d'œil à sa montre.|She glanced at her watch.", "Arrête de me regarder fixement.|Stop staring at me.", "Ils avançaient péniblement dans la neige.|They trudged through the snow.", "Il a marmonné quelque chose.|He muttered something.", "Nous avons flâné le long de la rivière.|We strolled along the river.", "Les enfants gloussaient au fond de la classe.|The children were giggling at the back of the class."],

{ t: "Registres familiers", c: "Manchester", e: "😎",
  w: ["crevé|knackered", "le fric|dosh", "génial|brilliant", "le mec|the bloke", "dégoûté (déçu)|gutted", "ravi|chuffed", "bidon|dodgy", "piquer (voler)|to nick", "glander|to faff about", "râler|to moan", "fauché|skint", "un petit somme|a kip"],
  g: ["Du familier au soutenu", "Le même fait se dit à trois niveaux. Savoir en changer est la marque d'une vraie maîtrise.<br><br>• <b>knackered</b> → tired → fatigued, exhausted<br>• <b>skint</b> → broke → impecunious<br>• <b>to nick</b> → to steal → to misappropriate<br>• <b>bloke</b> → man → gentleman<br>• <b>dodgy</b> → suspicious → questionable<br>• <b>to moan</b> → to complain → to lodge a complaint<br><br>Ces mots familiers sont surtout <b>britanniques</b>. Aux États-Unis : beat (crevé), broke (fauché), guy (mec), awesome (génial)."],
  x: ["I've been up since five; I'm absolutely ___.|knackered|chuffed|skint", "I can't come out tonight, I'm ___ until payday.|skint|gutted|dodgy", "Someone has ___ my bike!|nicked|moaned|faffed", "She was ___ to bits when she got the job.|chuffed|gutted|knackered", "Registre soutenu de « to moan » : to lodge a ___|complaint|moaning|complain", "That website looks a bit ___; don't give them your card.|dodgy|chuffed|skint"],
  p: ["Je suis complètement crevé.|I'm absolutely knackered.", "Je suis fauché jusqu'à la paie.|I'm skint until payday.", "On m'a piqué mon vélo.|Someone has nicked my bike.", "Elle était ravie de la nouvelle.|She was chuffed with the news.", "Arrête de râler !|Stop moaning!", "Je souhaite déposer une réclamation.|I wish to lodge a complaint."],
  r: "After a twelve-hour shift, Dave was knackered. When he came out, his bike had been nicked. He was gutted: skint until payday, he couldn't buy another. A bloke outside said he'd seen a dodgy-looking van. At the station Dave changed his tone completely: 'Good evening. I should like to report the theft of my bicycle.'",
  q: ["Dans quel état est Dave après le travail ?|Épuisé|Ravi|En colère", "Pourquoi ne peut-il pas racheter un vélo ?|Il est fauché|Les magasins sont fermés|Il n'en veut plus", "Que fait-il au commissariat ?|Il adopte un registre soutenu|Il parle en argot|Il se dispute"] },
{ t: "Style littéraire", c: "Stratford", e: "📖",
  w: ["si jamais|should", "le crépuscule|dusk", "l'aube|dawn", "éphémère|fleeting", "le chagrin|sorrow", "le présage|the omen", "demeurer|to dwell", "contempler|to behold", "las|weary", "le destin|fate", "errer|to wander", "nostalgique|wistful"],
  g: ["Les conditionnelles inversées", "Dans un style soutenu ou littéraire, on supprime <b>if</b> et on inverse.<br><br>• <b>Had I known</b>, I would have stayed. (= If I had known)<br>• <b>Were he to refuse</b>, we would be lost. (= If he refused)<br>• <b>Should you need</b> help, call me. (= If you need)<br>• <b>Were it not for</b> her, I would have failed. (sans elle)<br><br><b>Inversion après so / such</b><br>• <b>So great was</b> his sorrow that he could not speak.<br><br><b>Subjonctif figé</b> : <b>Long live</b> the king. <b>So be it.</b> <b>Far be it from me</b> to judge."],
  x: ["___ I known the truth, I would never have left.|Had|Have|Would", "___ he to return, everything would change.|Were|Was|Would", "___ you require assistance, please ring the bell.|Should|Would|Had you", "So deep ___ her sorrow that she could not speak.|was|did|had", "Were it not ___ his courage, we would have perished.|for|of|by", "Far ___ it from me to criticise.|be|is|was being"],
  p: ["Si j'avais su, je serais resté.|Had I known, I would have stayed.", "S'il venait à refuser, nous serions perdus.|Were he to refuse, we would be lost.", "Si vous avez besoin d'aide, appelez-moi.|Should you need help, call me.", "Sans elle, j'aurais échoué.|Were it not for her, I would have failed.", "Si grand était son chagrin qu'il ne pouvait parler.|So great was his sorrow that he could not speak.", "Ainsi soit-il.|So be it."],
  r: "At dusk the weary traveller came upon the house where he had dwelt as a boy. So changed was it that he scarcely knew it. Had he returned ten years sooner, he might have found his mother alive. He stood a while, wistful, beholding the dark windows. Were it not for the dawn, he thought, sorrow would have no end. Then he wandered on.",
  q: ["Que retrouve le voyageur ?|La maison de son enfance|Un vieil ami|Sa mère", "Qu'aurait-il trouvé dix ans plus tôt ?|Sa mère vivante|La maison intacte|Un trésor", "Que fait-il à la fin ?|Il reprend sa route|Il entre dans la maison|Il s'endort"] },
{ t: "Le jargon des affaires", c: "Londres (City)", e: "📈",
  w: ["faire le point|to touch base", "le résultat net|the bottom line", "tirer parti de|to leverage", "rationaliser|to streamline", "réduire les effectifs|to downsize", "à plus grande échelle|at scale", "le retour sur investissement|the return on investment", "l'approbation (adhésion)|buy-in", "le fruit à portée de main (gain facile)|low-hanging fruit", "changer la donne|to be a game changer", "revenir vers quelqu'un|to circle back", "en amont|upstream"],
  g: ["Décoder le jargon", "Le monde de l'entreprise parle par images et euphémismes. Il faut les comprendre, et savoir les traduire en anglais simple.<br><br>• <b>to touch base</b> = to talk briefly<br>• <b>the bottom line</b> = the final profit ; the key point<br>• <b>to downsize / to let go</b> = to dismiss staff<br>• <b>to leverage</b> = to use<br>• <b>going forward</b> = from now on<br>• <b>to take offline</b> = to discuss later, in private<br>• <b>to think outside the box</b> = to think creatively<br><br>Un bon rédacteur les emploie avec parcimonie : trop de jargon obscurcit le propos."],
  x: ["Let's touch ___ next week to review progress.|base|ground|hands", "The ___ line is that we are losing money.|bottom|lower|final end", "We need ___ from the whole team before we start.|buy-in|sell-out|pay-off for", "Let's start with the low-hanging ___.|fruit|branch|apple", "The firm had to ___ and cut 200 jobs.|downsize|leverage|streamline up", "I'll ___ back to you on that tomorrow.|circle|round|turn over"],
  p: ["Faisons le point la semaine prochaine.|Let's touch base next week.", "Le fait est que nous perdons de l'argent.|The bottom line is that we are losing money.", "Nous devons rationaliser nos processus.|We need to streamline our processes.", "Ce produit va changer la donne.|This product will be a game changer.", "Je reviens vers vous demain.|I will circle back to you tomorrow.", "L'entreprise a dû réduire ses effectifs.|The company had to downsize."],

  w: ["la répression|the crackdown", "le recul (régression)|the setback", "la percée|the breakthrough", "l'issue|the outcome", "la panne|the breakdown", "le dénouement (retombées)|the fallout", "le renflouement|the bailout", "l'épidémie (apparition)|the outbreak", "la contrepartie|the drawback", "l'apport|the input", "le contretemps|the hold-up", "la refonte|the overhaul"],
  g: ["Du verbe à particule au nom", "Beaucoup de noms courants viennent d'un verbe à particule, soudé ou relié par un trait d'union.<br><br>• to break <b>down</b> → a <b>breakdown</b> (panne)<br>• to break <b>through</b> → a <b>breakthrough</b> (percée)<br>• to crack <b>down</b> on → a <b>crackdown</b> (répression)<br>• to bail <b>out</b> → a <b>bailout</b> (renflouement)<br>• to hold <b>up</b> → a <b>hold-up</b> (retard)<br><br>Parfois la particule passe <b>devant</b> : to break out → an <b>outbreak</b> ; to come out → an <b>outcome</b> ; to put in → <b>input</b> ; to cry out → an <b>outcry</b>.<br><br>L'accent tombe sur la première syllabe du nom."],
  x: ["The police announced a ___ on drink-driving.|crackdown|breakdown|bailout", "The talks ended without any clear ___.|outcome|outbreak|input", "The bank needed a government ___.|bailout|fallout|setback", "There has been an ___ of flu in the school.|outbreak|outcome|overhaul", "The only ___ of the plan is its cost.|drawback|setback|hold-up", "The tax system needs a complete ___.|overhaul|outbreak|crackdown"],
  p: ["La police a annoncé une répression.|The police announced a crackdown.", "C'est une percée majeure.|It is a major breakthrough.", "La banque a eu besoin d'un renflouement.|The bank needed a bailout.", "Le seul inconvénient est le prix.|The only drawback is the price.", "Les négociations n'ont eu aucune issue.|The talks had no outcome.", "Le système a besoin d'une refonte.|The system needs an overhaul."],
  r: "After the bank's collapse, the government agreed to a bailout. The political fallout was immediate, and ministers promised a crackdown on risky lending. Experts called for a complete overhaul of the rules, but talks suffered one setback after another. The outcome, two years later, was a modest reform whose main drawback is that nobody understands it.",

{ t: "Proverbes", c: "Canterbury", e: "🦉",
  w: ["mieux vaut tard que jamais|better late than never", "l'habit ne fait pas le moine|don't judge a book by its cover", "qui ne risque rien n'a rien|nothing ventured, nothing gained", "c'est en forgeant qu'on devient forgeron|practice makes perfect", "un tiens vaut mieux que deux tu l'auras|a bird in the hand is worth two in the bush", "l'union fait la force|many hands make light work", "il ne faut pas vendre la peau de l'ours|don't count your chickens before they hatch", "à quelque chose malheur est bon|every cloud has a silver lining", "les actes valent mieux que les mots|actions speak louder than words", "trop de cuisiniers gâtent la sauce|too many cooks spoil the broth", "loin des yeux, loin du cœur|out of sight, out of mind", "à cheval donné on ne regarde pas les dents|never look a gift horse in the mouth"],
  g: ["La forme des proverbes", "Les proverbes anglais sont brefs, rythmés, souvent sans verbe.<br><br>• Deux moitiés parallèles : <b>Nothing ventured, nothing gained.</b> <b>Out of sight, out of mind.</b> <b>Easy come, easy go.</b><br>• Impératif négatif : <b>Don't count</b> your chickens… <b>Never look</b> a gift horse…<br>• Sujet au pluriel et vérité générale au présent : Actions <b>speak</b> louder than words.<br><br>On les cite souvent à moitié, le reste étant sous-entendu : « Well, <b>a bird in the hand</b>… », « <b>Every cloud</b>… ». Les reconnaître tronqués fait partie de la maîtrise."],
  x: ["Nothing ventured, nothing ___.|gained|won|earned", "Don't judge a book by its ___.|cover|title|pages", "Every cloud has a silver ___.|lining|shadow|edge", "Too many cooks spoil the ___.|broth|kitchen|dinner", "Actions speak ___ than words.|louder|stronger|better", "A bird in the hand is worth two in the ___.|bush|tree|sky"],
  p: ["Mieux vaut tard que jamais.|Better late than never.", "Qui ne risque rien n'a rien.|Nothing ventured, nothing gained.", "C'est en forgeant qu'on devient forgeron.|Practice makes perfect.", "Les actes valent mieux que les mots.|Actions speak louder than words.", "Loin des yeux, loin du cœur.|Out of sight, out of mind.", "À quelque chose malheur est bon.|Every cloud has a silver lining."],

  p: ["Si j'avais plus de temps, je voyagerais davantage.|Si tuviera más tiempo, viajaría más.", "Si j'étais chef, j'augmenterais les salaires.|Si fuera jefe, subiría los sueldos.", "Le syndicat exige une augmentation.|El sindicato exige un aumento.", "Il est difficile de concilier travail et famille.|Es difícil conciliar trabajo y familia.", "Le délai expire vendredi.|El plazo termina el viernes.", "Elle a obtenu une promotion.|Ha conseguido un ascenso."],
  r: "En una fábrica de Monterrey, el sindicato exige una jornada más corta. Los empleados dicen que, si tuvieran más tiempo libre, podrían conciliar mejor trabajo y familia. La dirección responde que, si redujera la jornada, tendría que contratar a más gente. Las dos partes negociarán hasta que termine el plazo.",
  q: ["Que réclame le syndicat ?|Une journée de travail plus courte|Une augmentation|Plus de télétravail", "Que feraient les salariés avec plus de temps libre ?|Mieux concilier travail et famille|Chercher un second emploi|Se former", "Que dit la direction ?|Qu'elle devrait embaucher davantage|Qu'elle fermerait l'usine|Qu'elle accepte"] },
{ t: "Ce qui aurait pu être", c: "Santiago", e: "🥗",
  w: ["l'alimentation|la alimentación", "le régime|la dieta", "le surpoids|el sobrepeso", "prévenir|prevenir", "le traitement|el tratamiento", "l'ordonnance|la receta", "l'effet secondaire|el efecto secundario", "le bien-être|el bienestar", "équilibré|equilibrado", "guérir|curarse", "regretter|arrepentirse", "se soigner|cuidarse"],
  g: ["L'irréel du passé", "Pour imaginer un passé différent :<br><b>Si + plus-que-parfait du subjonctif, conditionnel passé</b><br><br>• plus-que-parfait du subjonctif : <b>hubiera</b> + participe<br>• conditionnel passé : <b>habría</b> + participe<br><br>• Si <b>hubiera ido</b> al médico, me <b>habría curado</b> antes.<br>• Si no <b>hubieras fumado</b>, no <b>habrías enfermado</b>.<br><br>Reproche ou regret : <b>Deberías haber</b> venido. <b>Tendría que haber</b> llamado.<br>Conséquence présente : Si hubiera estudiado, ahora <b>tendría</b> trabajo."],
  x: ["Si ___ ido al médico, me habría curado antes.|hubiera|habría|había", "Si no hubieras fumado, no ___ enfermado.|habrías|hubieras|habías", "Deberías ___ venido antes.|haber|haberte de|habido", "Si hubiéramos comido mejor, ahora ___ más sanos.|estaríamos|estuviéramos|estamos", "Si ella lo ___ sabido, no lo habría tomado.|hubiera|habría|haya", "Yo en tu lugar ___ pedido otra opinión.|habría|hubiese de|había"],
  p: ["Si j'étais allé chez le médecin, j'aurais guéri plus vite.|Si hubiera ido al médico, me habría curado antes.", "Tu aurais dû venir plus tôt.|Deberías haber venido antes.", "Une alimentation équilibrée est essentielle.|Una alimentación equilibrada es esencial.", "Ce traitement a des effets secondaires.|Este tratamiento tiene efectos secundarios.", "Je regrette de ne pas m'être soigné.|Me arrepiento de no haberme cuidado.", "Si je l'avais su, je ne l'aurais pas fait.|Si lo hubiera sabido, no lo habría hecho."],

{ t: "Science", c: "Barcelone", e: "🔬",

  g: ["Les voix passives", "<b>ser + participe</b> (accordé) : passif d'action, surtout à l'écrit. L'auteur s'introduit par <b>por</b>.<br>• La vacuna <b>fue descubierta por</b> un equipo español.<br><br><b>estar + participe</b> : le résultat, l'état.<br>• El artículo <b>está publicado</b>. (c'est fait)<br><br><b>se + verbe</b> : la forme la plus courante quand on ne dit pas qui agit.<br>• <b>Se han publicado</b> los datos. <b>Se descubrió</b> en 1928.<br><br>À l'oral, l'espagnol préfère l'actif ou « se » à ser + participe."],
  x: ["La vacuna ___ descubierta en 1955.|fue|estuvo|se", "El estudio fue realizado ___ investigadores chilenos.|por|de|para", "___ han publicado los resultados esta semana.|Se|Son|Fue", "La puerta ___ cerrada desde ayer. (état)|está|es|se", "Los datos fueron ___ por tres equipos. (analizar)|analizados|analizado|analizando", "En este laboratorio se ___ nuevos dispositivos.|desarrollan|desarrolla|desarrollados"],
  p: ["Le vaccin a été découvert en 1955.|La vacuna fue descubierta en 1955.", "Les résultats ont été publiés cette semaine.|Se han publicado los resultados esta semana.", "L'étude a été réalisée par des chercheurs chiliens.|El estudio fue realizado por investigadores chilenos.", "Les données ne sont pas fiables.|Los datos no son fiables.", "C'est une avancée très importante.|Es un avance muy importante.", "Ils ont développé un nouvel appareil.|Han desarrollado un nuevo dispositivo."],

  g: ["aunque : indicatif ou subjonctif ?", "<b>aunque + indicatif</b> : un fait réel, connu. = bien que<br>• <b>Aunque llueve</b>, salgo. (il pleut, et je sors quand même)<br><br><b>aunque + subjonctif</b> : un fait hypothétique ou sans importance. = même si<br>• <b>Aunque llueva</b>, saldré. (qu'il pleuve ou non)<br><br><b>a pesar de</b> + nom ou infinitif ; <b>a pesar de que</b> + verbe.<br><br>Les connecteurs <b>sin embargo</b>, <b>por lo tanto</b>, <b>en cambio</b>, <b>además</b> se placent en tête, suivis d'une virgule."],
  x: ["Aunque ___ mañana, iremos a la reunión. (même s'il pleut)|llueva|llueve|lloverá", "Aunque ___ caro, lo compré. (c'était cher, fait réel)|era|fuera|sea", "A pesar ___ la crisis, la empresa crece.|de|que|por", "Los precios suben. ___, el consumo baja.|Por lo tanto|Aunque|A pesar de", "Las exportaciones crecen; ___, las importaciones caen.|en cambio|aunque|por eso de", "A pesar de ___ invertimos mucho, hubo pérdidas.|que|de|lo"],
  p: ["Même s'il pleut, nous irons.|Aunque llueva, iremos.", "Malgré la crise, l'entreprise grandit.|A pesar de la crisis, la empresa crece.", "Les prix augmentent ; par conséquent, la consommation baisse.|Los precios suben; por lo tanto, el consumo baja.", "L'entreprise a de nombreuses dettes.|La empresa tiene muchas deudas.", "Nous voulons investir dans la technologie.|Queremos invertir en tecnología.", "La croissance a été faible cette année.|El crecimiento ha sido débil este año."],
  r: "Aunque la economía ha crecido este año, muchas familias no lo notan. Los sueldos han subido; sin embargo, los precios lo han hecho más rápido. Por lo tanto, el consumo sigue débil. A pesar de las ayudas del gobierno, los expertos creen que la situación no cambiará, aunque bajen los impuestos.",
  q: ["Pourquoi les familles ne sentent-elles pas la croissance ?|Les prix ont monté plus vite que les salaires|Le chômage a augmenté|Les impôts ont monté", "Comment est la consommation ?|Elle reste faible|Elle explose|Elle est stable", "Que pensent les experts ?|La situation ne changera pas même avec des baisses d'impôts|Tout ira mieux bientôt|Une crise arrive"] },

  w: ["le parti|el partido", "le député|el diputado", "la majorité|la mayoría", "le débat|el debate", "la campagne électorale|la campaña electoral", "la réforme|la reforma", "affirmer|afirmar", "nier|negar", "promettre|prometer", "ordonner|ordenar", "prier (demander)|rogar", "démissionner|dimitir"],
  g: ["Rapporter un ordre ou une demande", "Quand on rapporte au passé un ordre, un conseil ou une demande, le verbe passe à l'<b>imparfait du subjonctif</b>.<br><br>• « Ven » → Me pidió que <b>viniera</b>.<br>• « No votéis » → Nos dijo que no <b>votáramos</b>.<br>• « Dimita » → Le exigieron que <b>dimitiera</b>.<br><br>Verbes déclencheurs : <b>pedir, rogar, ordenar, exigir, aconsejar, recomendar, prohibir, decir</b> (au sens de demander).<br><br>Attention : <b>decir que</b> + indicatif rapporte une information ; + subjonctif, un ordre.<br>• Dijo que <b>venía</b>. / Dijo que <b>viniera</b>."],
  x: ["El presidente pidió que todos ___ la calma. (mantener)|mantuvieran|mantienen|mantendrían", "Le exigieron que ___ inmediatamente. (dimitir)|dimitiera|dimite|dimitiría", "Me aconsejó que no ___ nada. (firmar)|firmara|firmo|firmaría", "Nos dijo que ___ temprano. (ordre : venir)|viniéramos|veníamos|vendríamos", "El diputado afirmó que la reforma ___ necesaria. (information)|era|fuera|sea", "Les rogó que ___ a votar. (ir)|fueran|iban|irían"],
  p: ["Il m'a demandé de venir.|Me pidió que viniera.", "On a exigé sa démission immédiate.|Le exigieron que dimitiera inmediatamente.", "Elle nous a conseillé de ne rien signer.|Nos aconsejó que no firmáramos nada.", "Le député a affirmé que la réforme était nécessaire.|El diputado afirmó que la reforma era necesaria.", "La majorité a voté contre.|La mayoría votó en contra.", "Il a nié avoir menti.|Negó haber mentido."],

  g: ["Les périphrases verbales", "L'espagnol exprime les nuances de l'action par verbe + infinitif ou gérondif.<br><br><b>+ infinitif</b><br>• <b>acabar de</b> : venir de — <b>volver a</b> : refaire — <b>dejar de</b> : arrêter de<br>• <b>ponerse a</b> : se mettre à — <b>estar a punto de</b> : être sur le point de<br>• <b>soler</b> : avoir l'habitude de — <b>llegar a</b> : parvenir à<br><br><b>+ gérondif</b><br>• <b>seguir / continuar</b> + gérondif : continuer à. <b>Sigue pintando</b>.<br>• <b>llevar</b> + durée + gérondif : depuis. <b>Llevo dos años viviendo</b> aquí.<br>• <b>ir</b> + gérondif : peu à peu. <b>Voy entendiendo</b>."],

{ t: "Suppositions", c: "Séville", e: "🌍",

  g: ["Futur et conditionnel de supposition", "Le <b>futur</b> exprime une supposition sur le <b>présent</b> :<br>• ¿Dónde está Ana? — <b>Estará</b> en casa. (elle doit être chez elle)<br>• <b>Serán</b> las diez. (il doit être dix heures)<br><br>Le <b>futur antérieur</b> (habrá + participe) : supposition sur un passé récent, ou action achevée dans l'avenir.<br>• <b>Habrá perdido</b> el tren. (il a dû rater le train)<br>• En 2050 <b>habremos reducido</b> las emisiones.<br><br>Le <b>conditionnel</b> : supposition sur le passé.<br>• <b>Tendría</b> unos veinte años. (il devait avoir vingt ans)"],
  x: ["No contesta. ___ durmiendo. (il doit être)|Estará|Estuvo|Estaría siendo", "¿Qué hora es? — ___ las once.|Serán|Fueron|Son que", "Llega tarde. Habrá ___ el autobús.|perdido|perder|perdiendo", "En 2050 habremos ___ las emisiones.|reducido|reducir|reduciendo", "Cuando lo conocí, ___ unos treinta años.|tendría|tendrá|tenga", "Para entonces ya ___ terminado la sequía.|habrá|habría sido|hubiera"],
  p: ["Il doit être chez lui.|Estará en casa.", "Il a dû rater le train.|Habrá perdido el tren.", "Il doit être dix heures.|Serán las diez.", "D'ici 2050, nous aurons réduit les émissions.|En 2050 habremos reducido las emisiones.", "La sécheresse a épuisé les réserves d'eau.|La sequía ha agotado las reservas de agua.", "Les énergies renouvelables réduisent le risque.|Las energías renovables reducen el riesgo."],

{ t: "Devenir", c: "La Corogne", e: "🗣️",
  w: ["devenir (humeur)|ponerse", "devenir (changement profond)|volverse", "devenir (par effort)|hacerse", "se retrouver (rester)|quedarse", "se transformer en|convertirse en", "parvenir à être|llegar a ser", "nerveux|nervioso", "fou|loco", "célèbre|famoso", "veuf|viudo", "méfiant|desconfiado", "rougir|ponerse rojo"],
  g: ["Les verbes de changement", "Le français « devenir » se traduit selon la nature du changement.<br><br>• <b>ponerse</b> + adjectif : changement passager (humeur, aspect). Se <b>puso</b> nervioso.<br>• <b>volverse</b> + adjectif : changement profond, souvent négatif. Se <b>volvió</b> desconfiado.<br>• <b>hacerse</b> + nom / adjectif : par volonté ou évolution (métier, idéologie, âge). Se <b>hizo</b> médico. Se <b>hizo</b> rico.<br>• <b>quedarse</b> : résultat après un événement, souvent une perte. Se <b>quedó</b> viudo, sin trabajo, sorprendido.<br>• <b>convertirse en</b> + nom : transformation. Se <b>convirtió en</b> una estrella.<br>• <b>llegar a ser</b> : aboutissement d'un long parcours."],

{ t: "ser ou estar", c: "Tenerife", e: "🧳",
  w: ["intelligent / prêt|listo", "ennuyeux / qui s'ennuie|aburrido", "riche / délicieux|rico", "méchant / malade|malo", "vert / pas mûr|verde", "vif / vivant|vivo", "sûr (fiable) / certain|seguro", "ouvert (d'esprit) / ouvert|abierto", "attentif / prévenant|atento", "fier / orgueilleux|orgulloso", "fatigant / fatigué|cansado", "éveillé / dégourdi|despierto"],
  g: ["Quand l'adjectif change de sens", "<b>ser</b> décrit ce qu'est une chose ; <b>estar</b>, l'état où elle se trouve. Avec certains adjectifs, le sens change complètement.<br><br>• ser <b>listo</b> : être intelligent / estar <b>listo</b> : être prêt<br>• ser <b>aburrido</b> : être ennuyeux / estar <b>aburrido</b> : s'ennuyer<br>• ser <b>rico</b> : être riche / estar <b>rico</b> : être délicieux<br>• ser <b>malo</b> : être méchant / estar <b>malo</b> : être malade<br>• ser <b>verde</b> : être vert / estar <b>verde</b> : ne pas être mûr<br>• ser <b>vivo</b> : être vif / estar <b>vivo</b> : être vivant<br>• ser <b>cansado</b> : être fatigant / estar <b>cansado</b> : être fatigué"],

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

}

}

  const s = S.srs[k] || (S.srs[k] = { b: 0, d: 0, e: 0 });

  if (!c || !c.units[u]) return null;

/* ---------- contenu ---------- */

function distract(pool, it, key, n) {
  const seen = new Set([it[key]]), out = [];

  return out;

function cloze(c, u, i) {
  const [s, a, ...d] = c.units[u].x[i].split('|');
  return { type: 'mcq', label: 'Complète la phrase', q: s, a, opts: shuffle([a, ...d]), say: s.replace('___', a).replace(/\s*\([^)]*\)/g, '') };
}
function readQ(c, u, i) {
  const [q, a, ...d] = c.units[u].q[i].split('|');
  return { type: 'mcq', label: 'Compréhension', ctx: c.units[u].r, q, a, opts: shuffle([a, ...d]) };
}
function orderEx(c, it, audio) {
  const toks = it.t.split(' ');
  const others = shuffle(allP(c).filter(p => p.k !== it.k).flatMap(p => p.t.split(' '))).filter(t => !toks.includes(t));
  const extra = [...new Set(others)].slice(0, 2);
  return { type: 'order', k: it.k, q: it.fr, a: it.t, say: it.t, audio: !!audio && hasTTS(), tiles: shuffle([...toks, ...extra]) };
}
// Les expressions longues se choisissent au lieu de se taper.
const typeEx = (it, c) => it.t.split(' ').length > 3 ? mcqItem(c, it, 'ft') : { type: 'type', k: it.k, q: it.fr, a: it.t, say: it.t };
const matchEx = its => ({ type: 'match', pairs: its.map(i => [i.fr, i.t]) });

const LESSONS = [['Vocabulaire 1', '📖'], ['Vocabulaire 2', '📗'], ['Grammaire', '🧩'], ['Phrases', '💬'], ['Lecture', '👂']];

function genLesson(c, u, l) {
  const U = c.units[u], q = [];
  if (l < 2) {
    const its = unitW(c, u).slice(l * 6, l * 6 + 6);
    const a = its.slice(0, 3), b = its.slice(3);
    a.forEach(it => q.push({ type: 'intro', it }));
    shuffle(a).forEach(it => q.push(mcqItem(c, it, 'ft')));
    b.forEach(it => q.push({ type: 'intro', it }));
    shuffle(b).forEach(it => q.push(mcqItem(c, it, 'ft')));
    const sh = shuffle(its);
    q.push(...shuffle([...sh.slice(0, 3).map(it => mcqItem(c, it, 'tf')), ...sh.slice(3).map(it => mcqItem(c, it, 'af')), matchEx(sh.slice(0, 5))]));
    pick(its, 3).forEach(it => q.push(typeEx(it, c)));
  } else if (l === 2) {
    q.push({ type: 'info', title: U.g[0], html: U.g[1] });
    U.x.forEach((_, i) => q.push(cloze(c, u, i)));
    pick(unitW(c, u), 3).forEach(it => q.push(mcqItem(c, it, 'ft')));
  } else if (l === 3) {
    const ps = unitP(c, u);
    ps.forEach(it => q.push(orderEx(c, it)));
    pick(ps, 3).forEach(it => q.push(orderEx(c, it, true)));
    pick(ps, 2).forEach(it => q.push(mcqItem(c, it, 'tf')));
  } else {
    q.push({ type: 'info', title: 'Lis et écoute le texte', html: esc(U.r), say: U.r, text: true });
    U.q.forEach((_, i) => q.push(readQ(c, u, i)));
    q.push(typeEx(pick(unitW(c, u), 1)[0], c), orderEx(c, pick(unitP(c, u), 1)[0]), cloze(c, u, Math.random() * U.x.length | 0));
  }
  return q;
}
function genTest(c, u) {
  const U = c.units[u], w = pick(unitW(c, u), 6), q = [];
  q.push(mcqItem(c, w[0], 'ft'), mcqItem(c, w[1], 'ft'), mcqItem(c, w[2], 'tf'), mcqItem(c, w[3], 'tf'), typeEx(w[4], c), typeEx(w[5], c));
  pick(U.x.map((_, i) => i), 3).forEach(i => q.push(cloze(c, u, i)));
  pick(unitP(c, u), 2).forEach(it => q.push(orderEx(c, it)));
  q.push(readQ(c, u, Math.random() * U.q.length | 0));
  return shuffle(q);
}
function genExam(c) {
  const q = [];
  c.units.forEach((U, u) => {
    q.push(mcqItem(c, pick(unitW(c, u), 1)[0], Math.random() < .5 ? 'ft' : 'tf'), cloze(c, u, Math.random() * U.x.length | 0), orderEx(c, pick(unitP(c, u), 1)[0]));
  });
  return shuffle(q);
}
function genReview(c) {
  return pick(dueKeys(c), 15).map(itemOf).filter(Boolean).map(it => {
    const ic = courseOfKey(it.k);
    if (it.kind === 'p') return orderEx(ic, it);
    const b = (S.srs[it.k] || {}).b || 0, r = Math.random();
    return b >= 2 && r < .4 ? typeEx(it, ic) : mcqItem(ic, it, r < .7 ? 'ft' : 'tf');
  });
}
const gamePool = c => c.units.slice(0, maxUnit(c) + 1).flatMap((_, u) => unitW(c, u));

/* ---------- vérification des réponses tapées ---------- */
const norm = s => s.toLowerCase().replace(/[.,!?¿¡;:"]/g, '').replace(/[’`]/g, "'").replace(/\s+/g, ' ').trim().replace(/^(to|the) /, '');
const noAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// 2 = exact, 1 = presque (accent ou une lettre), 0 = faux
function checkTyped(inp, a) {
  const x = norm(inp), y = norm(a);
  if (!x) return 0;
  if (x === y) return 2;
  if (noAcc(x) === noAcc(y)) return 1;
  if (y.length >= 6 && lev(x, y) <= 1) return 1;
  return 0;
}

let actx = null;
function beep(freqs, dur = .12) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    });
  } catch (e) { }
}
function say(t, lang) {
  if (!hasTTS() || !S.voice || !t) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/___/g, ' ')); u.lang = lang; u.rate = .9;
    const vs = speechSynthesis.getVoices(), p = lang.slice(0, 2).toLowerCase();
    const v = vs.find(v => v.lang.replace('_', '-') === lang) || vs.find(v => v.lang.toLowerCase().startsWith(p));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { }
}

function begin(o) { R = Object.assign({ i: 0, ok: 0, err: 0, lock: false }, o); R.total = R.q.filter(e => e.type !== 'intro' && e.type !== 'info').length; showEx(); }

function showEx() {
  const ex = R.q[R.i];
  if (!ex) return finish(true);
  R.lock = false; R.ex = ex; R.sel = []; R.m = null;
  const pct = Math.round(R.i / R.q.length * 100);
  let top = `<div class="top"><button class="x" onclick="quit()">✕</button><div class="pbar"><i style="width:${pct}%"></i></div>${R.lives != null ? `<span class="lives">❤️ ${R.lives}</span>` : ''}</div>`;
  if (R.boss) { const need = R.total - (Math.floor(R.total * .2)); top += `<div class="bossbar"><span>${R.c.boss}</span><div class="pbar red"><i style="width:${Math.max(0, 100 - R.ok / need * 100)}%"></i></div></div>`; }
  let b = '';
  const spk = `<button class="spk" onclick="resay()">🔊</button>`;
  if (ex.type === 'intro') {
    b = `<div class="lab">Nouveau ${ex.it.kind === 'w' ? 'mot' : 'phrase'}</div><div class="flash"><div class="ft">${esc(ex.it.t)}</div><div class="ff">${esc(ex.it.fr)}</div>${hasTTS() ? spk : ''}</div><button class="btn bottom" onclick="next()">Continuer</button>`;
  } else if (ex.type === 'info') {
    b = `<div class="lab">${esc(ex.title)}</div><div class="info ${ex.text ? 'txt' : ''}">${ex.html}</div>${ex.say && hasTTS() ? spk : ''}<button class="btn bottom" onclick="next()">${ex.text ? 'Répondre aux questions' : 'J’ai compris'}</button>`;
  } else if (ex.type === 'mcq') {
    b = `<div class="lab">${ex.label}</div>${ex.ctx ? `<div class="info txt small">${esc(ex.ctx)}</div>` : ''}${ex.audio ? `<div class="center">${spk.replace('spk', 'spk xl')}</div>` : `<div class="q">${esc(ex.q)}</div>`}
    <div class="opts">${ex.opts.map((o, i) => `<button class="opt" onclick="ansMcq(${i})"><i>${'ABCD'[i]}</i>${esc(o)}</button>`).join('')}</div>`;
  } else if (ex.type === 'type') {
    b = `<div class="lab">Écris en ${esc(R.c.name.toLowerCase())}</div><div class="q">${esc(ex.q)}</div>
    <input id="inp" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ta réponse" onkeydown="if(event.key==='Enter')ansType()">
    <button class="btn bottom" id="chk" onclick="ansType()">Vérifier</button>`;
  } else if (ex.type === 'order') {
    b = `<div class="lab">${ex.audio ? 'Écoute et reconstitue la phrase' : 'Traduis en remettant les mots dans l’ordre'}</div>${ex.audio ? `<div class="center">${spk.replace('spk', 'spk xl')}</div>` : `<div class="q">${esc(ex.q)}</div>`}
    <div id="ord"></div><button class="btn bottom" id="chk" onclick="ansOrder()">Vérifier</button>`;
  } else if (ex.type === 'match') {
    R.m = { L: shuffle(ex.pairs.map((p, i) => i)), Rr: shuffle(ex.pairs.map((p, i) => i)), a: null, b: null, done: new Set(), miss: 0 };
    b = `<div class="lab">Associe les paires</div><div id="mat"></div>`;
  }
  root().innerHTML = `<div class="sess">${top}<div class="exo">${b}</div><div id="fb"></div></div>`;
  window.scrollTo(0, 0);
  if (ex.type === 'order') drawOrder();
  if (ex.type === 'match') drawMatch();
  if (ex.type === 'type') { const i = $('#inp'); if (i) i.focus(); }
  if (ex.type === 'intro') say(ex.it.t, R.c.tts);
  else if (ex.audio || (ex.type === 'mcq' && ex.q === ex.say)) say(ex.say, R.c.tts);
}
function resay() { const ex = R.ex; say(ex.type === 'intro' ? ex.it.t : ex.say, R.c.tts); }
function next() { R.i++; showEx(); }

function ansMcq(i) {
  if (R.lock) return; const ex = R.ex, ok = ex.opts[i] === ex.a;
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (ex.opts[j] === ex.a) b.classList.add('good'); else if (j === i) b.classList.add('bad'); });
  done(ok, ex.a);
}
function ansType() {
  if (R.lock) return; const ex = R.ex, i = $('#inp'), r = checkTyped(i.value, ex.a);
  if (!i.value.trim()) return;
  i.disabled = true; done(r > 0, ex.a, r === 1 ? 'Presque parfait, attention à l’orthographe.' : '');
}
function drawOrder() {
  const ex = R.ex;
  $('#ord').innerHTML = `<div class="line">${R.sel.map((ti, p) => `<button class="tile" onclick="unsel(${p})">${esc(ex.tiles[ti])}</button>`).join('')}</div>
  <div class="bank">${ex.tiles.map((t, ti) => `<button class="tile ${R.sel.includes(ti) ? 'used' : ''}" ${R.sel.includes(ti) ? 'disabled' : ''} onclick="selTile(${ti})">${esc(t)}</button>`).join('')}</div>`;
}
function selTile(ti) { if (R.lock) return; R.sel.push(ti); drawOrder(); }
function unsel(p) { if (R.lock) return; R.sel.splice(p, 1); drawOrder(); }
function ansOrder() {
  if (R.lock || !R.sel.length) return; const ex = R.ex;
  done(R.sel.map(ti => ex.tiles[ti]).join(' ') === ex.a, ex.a);
}
function drawMatch() {
  const ex = R.ex, m = R.m;
  const col = (ids, side) => ids.map(i => `<button class="opt m ${m.done.has(i) ? 'good' : ''} ${m[side] === i ? 'sel' : ''}" ${m.done.has(i) ? 'disabled' : ''} onclick="pickM('${side}',${i})">${esc(ex.pairs[i][side === 'a' ? 0 : 1])}</button>`).join('');
  $('#mat').innerHTML = `<div class="cols"><div>${col(m.L, 'a')}</div><div>${col(m.Rr, 'b')}</div></div>`;
}
function pickM(side, i) {
  if (R.lock) return; const m = R.m; m[side] = m[side] === i ? null : i;
  if (m.a != null && m.b != null) {
    if (m.a === m.b) { m.done.add(m.a); beep([660]); } else { m.miss++; beep([200]); }
    m.a = m.b = null;
  }
  drawMatch();
  if (m.done.size === R.ex.pairs.length) done(m.miss <= 1, '');
}

function done(ok, answer, note) {
  R.lock = true; const ex = R.ex;
  if (ok) { R.ok++; beep([660, 880]); } else { R.err++; beep([220, 160], .16); if (R.lives != null) R.lives--; if (R.requeue && !ex.re) R.q.push(Object.assign({}, ex, { re: true })); }
  if (ex.k) { srsUp(ex.k, ok); save(); }
  if (ex.say && !ex.audio && ex.type !== 'match') say(ex.say, R.c.tts);
  const chk = $('#chk'); if (chk) chk.style.display = 'none';
  const good = ['Bravo !', 'Exact !', 'Bien joué !', 'Parfait !', 'Nickel !'], bad = ['Raté…', 'Pas tout à fait', 'Presque !'];
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'ko'}"><b>${ok ? good[Math.random() * good.length | 0] : bad[Math.random() * bad.length | 0]}</b>
  ${!ok && answer ? `<div>Bonne réponse : <b>${esc(answer)}</b></div>` : ''}${note ? `<div>${note}${answer ? ' Réponse : <b>' + esc(answer) + '</b>' : ''}</div>` : ''}
  <button class="btn" onclick="${R.lives === 0 ? 'finish(false)' : 'next()'}">Continuer</button></div>`;
}

function finish(completed) {
  const r = R, c = r.c, cs = CS(c.id); R = null;
  if (hasTTS()) speechSynthesis.cancel();
  const pct = r.total ? Math.round(r.ok / r.total * 100) : 100;
  let emo = '🎉', title = 'Terminé !', msg = '', xp = 0, win = true;
  if (r.mode === 'lesson') {
    const stars = r.err === 0 ? 3 : r.err <= 2 ? 2 : 1;
    cs.done[r.u + ':' + r.l] = Math.max(cs.done[r.u + ':' + r.l] || 0, stars);
    xp = 10 + (r.err === 0 ? 5 : 0); title = 'Leçon terminée'; emo = '⭐'.repeat(stars);
    msg = r.err === 0 ? 'Sans aucune erreur !' : `${r.err} erreur${r.err > 1 ? 's' : ''}, corrigée${r.err > 1 ? 's' : ''} en route.`;
  } else if (r.mode === 'test') {
    win = pct >= 80; cs.pass[r.u] = Math.max(cs.pass[r.u] || 0, pct);
    xp = win ? 20 : 5; emo = win ? '🎯' : '💪'; title = win ? 'Contrôle réussi !' : 'Contrôle à repasser';
    msg = `Score : ${pct}% (80% requis). ${win ? (r.u < c.units.length - 1 ? 'Étape suivante débloquée.' : 'Toutes les étapes sont validées : l’examen final t’attend.') : 'Refais les leçons de l’étape et retente ta chance.'}`;
    if (win) V.open = null;
  } else if (r.mode === 'exam') {
    win = completed && r.lives > 0; if (win) cs.exam = 1;
    xp = win ? 100 : 10; emo = win ? '👑' : c.boss; title = win ? `Niveau ${c.level} validé !` : `${c.bossName} a gagné…`;
    const L = langCourses(c.lang), nx = L[L.indexOf(c) + 1];
    msg = win ? `Tu as vaincu ${c.bossName} avec ${pct}% de bonnes réponses.` + (nx ? ` Le niveau ${nx.level} est débloqué.` : ' Tu as terminé tout le parcours.') : 'Révise les étapes les plus fragiles et reviens l’affronter.';
    if (win && nx) { S.lang = nx.id; S.cur[c.lang] = nx.id; }
    V.open = null;
  } else if (r.mode === 'review') {
    xp = r.ok; title = 'Révision terminée'; emo = '🔁'; msg = `${r.ok} bonne${r.ok > 1 ? 's' : ''} réponse${r.ok > 1 ? 's' : ''}.`;
  } else if (r.mode === 'survie') {
    const k = c.id + 'surv', rec = r.ok > (S.best[k] || 0); if (rec) S.best[k] = r.ok;
    xp = Math.floor(r.ok / 2); emo = '💀'; title = `Score : ${r.ok}`; msg = rec ? 'Nouveau record !' : `Record : ${S.best[k]}`;
  }
  addXp(xp);
  resultScreen(emo, title, msg, xp, win);
}
function resultScreen(emo, title, msg, xp, win) {
  if (win) beep([523, 659, 784, 1047], .11);
  root().innerHTML = `<div class="sess res">${win ? confetti() : ''}<div class="halo ${win ? 'win' : ''}"><div class="remo">${emo}</div></div><h1>${esc(title)}</h1><p>${esc(msg)}</p>
  <div class="xp">+${xp} XP</div><p class="note">🔥 ${streakNow()} jour${streakNow() > 1 ? 's' : ''} de suite · Objectif : ${dayXpNow()} / ${S.goal} XP</p>
  <button class="btn" onclick="render()">Continuer</button></div>`;
}
function confetti() {
  const e = ['🎉', '⭐', '✨', '🎊', '💫']; let h = '<div class="conf">';
  for (let i = 0; i < 26; i++) h += `<i style="left:${Math.random() * 100}%;animation-delay:${Math.random() * .8}s;animation-duration:${1.6 + Math.random() * 1.6}s">${e[i % e.length]}</i>`;
  return h + '</div>';
}

/* ---------- mini-jeux ---------- */
function endGame() { if (G && G.timer) clearInterval(G.timer); G = null; render(); }
function startChrono() {
  const c = C(); G = { kind: 'chrono', c, t: 60, score: 0, pool: gamePool(c), lock: false };
  G.timer = setInterval(() => { if (!G) return; G.t--; const e = $('#tm'); if (e) e.textContent = G.t; if (G.t <= 0) chronoEnd(); }, 1000);
  chronoQ();
}
function chronoQ() {
  G.ex = mcqItem(G.c, pick(G.pool, 1)[0], Math.random() < .5 ? 'ft' : 'tf'); G.lock = false;
  root().innerHTML = `<div class="sess"><div class="top"><button class="x" onclick="endGame()">✕</button><span class="lives">⏱️ <b id="tm">${G.t}</b> s</span><span class="lives">⚡ ${G.score}</span></div>
  <div class="exo"><div class="lab">${G.ex.label}</div><div class="q">${esc(G.ex.q)}</div><div class="opts">${G.ex.opts.map((o, i) => `<button class="opt" onclick="chronoA(${i})"><i>${'ABCD'[i]}</i>${esc(o)}</button>`).join('')}</div></div></div>`;
}
function chronoA(i) {
  if (!G || G.lock) return; G.lock = true; const ok = G.ex.opts[i] === G.ex.a;
  document.querySelectorAll('.opt').forEach((b, j) => { if (G.ex.opts[j] === G.ex.a) b.classList.add('good'); else if (j === i) b.classList.add('bad'); });
  if (ok) { G.score++; beep([880], .08); } else beep([200], .12);
  setTimeout(() => { if (G && G.kind === 'chrono' && G.t > 0) chronoQ(); }, ok ? 250 : 800);
}
function chronoEnd() {
  const g = G; clearInterval(g.timer); G = null;
  const k = g.c.id + 'chrono', rec = g.score > (S.best[k] || 0); if (rec) S.best[k] = g.score;
  const xp = Math.floor(g.score / 2); addXp(xp);
  resultScreen('⚡', `Score : ${g.score}`, rec ? 'Nouveau record !' : `Record : ${S.best[k]}`, xp, true);
}
function startMemory() {
  const c = C(), its = pick(gamePool(c), 6);
  G = { kind: 'mem', c, cards: shuffle(its.flatMap((it, i) => [{ p: i, t: it.fr }, { p: i, t: it.t, say: true }])), open: [], found: new Set(), moves: 0, lock: false };
  drawMem();
}
function drawMem() {
  root().innerHTML = `<div class="sess"><div class="top"><button class="x" onclick="endGame()">✕</button><span class="lives">🃏 ${G.moves} coups</span></div>
  <div class="exo"><div class="lab">Retrouve les paires</div><div class="mem">${G.cards.map((cd, i) => { const up = G.open.includes(i) || G.found.has(cd.p); return `<button class="mc ${up ? 'up' : ''} ${G.found.has(cd.p) ? 'good' : ''}" onclick="memA(${i})">${up ? esc(cd.t) : '?'}</button>`; }).join('')}</div></div></div>`;
}
function memA(i) {
  if (!G || G.lock || G.open.includes(i) || G.found.has(G.cards[i].p)) return;
  G.open.push(i); if (G.cards[i].say) say(G.cards[i].t, G.c.tts);
  if (G.open.length === 2) {
    G.moves++; const [a, b] = G.open;
    if (G.cards[a].p === G.cards[b].p) { G.found.add(G.cards[a].p); G.open = []; beep([660, 880]); }
    else { G.lock = true; setTimeout(() => { if (G && G.kind === 'mem') { G.open = []; G.lock = false; drawMem(); } }, 900); }
  }
  drawMem();
  if (G.found.size === 6) {
    const g = G; G = null; const k = g.c.id + 'mem', rec = !S.best[k] || g.moves < S.best[k]; if (rec) S.best[k] = g.moves;
    addXp(5); setTimeout(() => resultScreen('🃏', `Terminé en ${g.moves} coups`, rec ? 'Nouveau record !' : `Record : ${S.best[k]} coups`, 5, true), 500);
  }
}

/* ---------- démarrage ---------- */
if (typeof document !== 'undefined') {
  if (hasTTS()) { try { speechSynthesis.getVoices(); } catch (e) { } }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  render();
}

</script>
</body>
</html>
